services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deepagent
      POSTGRES_PASSWORD: deepagent
      POSTGRES_DB: deepagent
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://deepagent:deepagent@postgres:5432/deepagent
      - REDIS_URL=redis://redis:6379/0
      - UPSTASH_REDIS_REST_URL=
      - UPSTASH_REDIS_REST_TOKEN=
      - KAFKA_ENABLED=false
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DISPLAY=:99
      - BROWSER_HEADLESS=true
    volumes:
      - browser_data:/app/browser_data
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres_data:
  redis_data:
  browser_data:
